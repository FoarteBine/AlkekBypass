<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F3X Image to BMP Hex Converter</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #121214;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #18181c;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #282830;
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            color: #ffffff;
            margin-bottom: 20px;
        }
        .group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 12px;
            color: #a0a0ab;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input[type="file"] {
            display: none;
        }
        .file-upload {
            display: block;
            background-color: #222228;
            border: 2px dashed #3a3a46;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            color: #8a8a9a;
            font-size: 14px;
        }
        .file-upload:hover {
            border-color: #007aff;
            color: #ffffff;
        }
        select {
            width: 100%;
            padding: 10px;
            background-color: #222228;
            border: 1px solid #3a3a46;
            border-radius: 6px;
            color: #ffffff;
            font-size: 14px;
            outline: none;
        }
        .preview-box {
            display: flex;
            align-items: center;
            gap: 16px;
            background-color: #0f0f12;
            padding: 12px;
            border-radius: 8px;
        }
        canvas {
            image-rendering: pixelated;
            border: 1px solid #3a3a46;
            border-radius: 4px;
            background-color: #18181c;
        }
        .info {
            font-size: 12px;
            color: #8a8a9a;
        }
        textarea {
            width: 100%;
            height: 100px;
            background-color: #0f0f12;
            border: 1px solid #282830;
            border-radius: 6px;
            color: #00ff66;
            font-family: monospace;
            font-size: 11px;
            padding: 10px;
            resize: none;
            outline: none;
            word-break: break-all;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007aff;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 8px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #33333d;
            color: #666673;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>F3X Image to BMP Hex Converter</h2>

    <div class="group">
        <label>1. Select Image</label>
        <label for="imgInput" class="file-upload" id="fileLabel">Click to select file</label>
        <input type="file" id="imgInput" accept="image/*">
    </div>

    <div class="group">
        <label>2. Grid Size (Parts)</label>
        <select id="sizeSelect">
            <option value="16">16 x 16</option>
            <option value="32" selected>32 x 32</option>
            <option value="64">64 x 64</option>
        </select>
    </div>

    <div class="group">
        <label>Preview</label>
        <div class="preview-box">
            <canvas id="previewCanvas" width="32" height="32" style="width: 64px; height: 64px;"></canvas>
            <div class="info" id="statusText">Upload an image</div>
        </div>
    </div>

    <div class="group">
        <label>3. Output Hex (24-bit BMP)</label>
        <textarea id="hexOutput" readonly placeholder="Hex code will appear here..."></textarea>
    </div>

    <button id="copyBtn" disabled>Copy Hex</button>
</div>

<script>
    const imgInput = document.getElementById('imgInput');
    const fileLabel = document.getElementById('fileLabel');
    const sizeSelect = document.getElementById('sizeSelect');
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    const hexOutput = document.getElementById('hexOutput');
    const copyBtn = document.getElementById('copyBtn');
    const statusText = document.getElementById('statusText');

    let currentImg = null;

    imgInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        
        fileLabel.innerText = file.name;
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                currentImg = img;
                processImage();
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    });

    sizeSelect.addEventListener('change', () => {
        if (currentImg) processImage();
    });

    function processImage() {
        const size = parseInt(sizeSelect.value);
        canvas.width = size;
        canvas.height = size;

        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(currentImg, 0, 0, size, size);

        const imgData = ctx.getImageData(0, 0, size, size);
        const bmpBuffer = create24BitBMP(imgData.data, size, size);
        
        const hexString = Array.from(new Uint8Array(bmpBuffer))
            .map(b => b.toString(16).padStart(2, '0').toUpperCase())
            .join(' ');

        hexOutput.value = hexString;
        copyBtn.disabled = false;
        statusText.innerText = `Size: ${size}x${size} | Total parts: ${size * size}`;
    }

    function create24BitBMP(rgbaData, width, height) {
        const rowSize = Math.floor((24 * width + 31) / 32) * 4;
        const pixelDataSize = rowSize * height;
        const fileSize = 54 + pixelDataSize;

        const buffer = new ArrayBuffer(fileSize);
        const view = new DataView(buffer);

        view.setUint16(0, 0x4D42, false);
        view.setUint32(2, fileSize, true);
        view.setUint32(6, 0, true);
        view.setUint32(10, 54, true);

        view.setUint32(14, 40, true);
        view.setInt32(18, width, true);
        view.setInt32(22, height, true);
        view.setUint16(26, 1, true);
        view.setUint16(28, 24, true);
        view.setUint32(30, 0, true);
        view.setUint32(34, pixelDataSize, true);
        view.setInt32(38, 2835, true);
        view.setInt32(42, 2835, true);
        view.setUint32(46, 0, true);
        view.setUint32(50, 0, true);

        const pixels = new Uint8Array(buffer, 54);
        for (let y = 0; y < height; y++) {
            const srcY = height - 1 - y;
            for (let x = 0; x < width; x++) {
                const srcIdx = (srcY * width + x) * 4;
                const dstIdx = y * rowSize + x * 3;

                pixels[dstIdx] = rgbaData[srcIdx + 2];
                pixels[dstIdx + 1] = rgbaData[srcIdx + 1];
                pixels[dstIdx + 2] = rgbaData[srcIdx];
            }
        }

        return buffer;
    }

    copyBtn.addEventListener('click', () => {
        hexOutput.select();
        navigator.clipboard.writeText(hexOutput.value);
        copyBtn.innerText = 'Copied!';
        setTimeout(() => { copyBtn.innerText = 'Copy Hex'; }, 2000);
    });
</script>

</body>
</html>
